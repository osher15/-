name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true מפעיל את Pages ומגדיר את המקור ל-Actions,
      # גם אם עד עכשיו הוא הצביע על ענף או תיקייה שלא קיימים
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # מעלים את כל שורש המאגר: index.html בשורש ותיקיית nutrition תחתיו
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
